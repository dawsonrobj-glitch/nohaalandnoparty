<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<title>The Slate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F4;
  --card:#FFFFFF;
  --ink:#14161A;
  --muted:#6E7480;
  --line:#E8E8E4;
  --red:#C0342B;
  --green:#12764A;
  --dark:#0F1115;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 64px}
.num{font-variant-numeric:tabular-nums}

/* header */
header{padding:8px 0 20px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.title{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.btn-link{
  flex:none;text-decoration:none;font-size:14px;font-weight:600;
  color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:7px 16px;margin-top:3px;
}
.btn-link:active{background:var(--bg)}
.btn-link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* hero */
.hero{
  background:var(--dark);color:#fff;border-radius:var(--radius);
  padding:22px 20px;margin-bottom:14px;
}
.hero-label{font-size:13px;font-weight:500;color:#9BA1AD;margin:0}
.hero-figure{font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:2px 0 0}
.hero-foot{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14px}
.hero-foot span{color:#9BA1AD}
.hero-foot b{color:#fff;font-weight:600}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-head p{margin:0;font-size:13px;color:var(--muted);text-align:right}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none;padding-top:2px}
.rank{width:20px;flex:none;font-size:14px;color:var(--muted);font-weight:600}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{flex:none;font-weight:700;text-align:right}
.val small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.money{color:var(--red)}
.credit{color:var(--green)}

/* bar */
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--red)}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;vertical-align:1px;margin-left:6px}
.pill-lead{background:#E4F2EA;color:var(--green)}
.pill-mascot{background:#EDEDF2;color:#54596A}
.pill-ban{background:var(--red);color:#fff}

/* ledger */
.led{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.led:first-of-type{border-top:none}
.led-main{flex:1;min-width:0}
.led-main b{font-weight:600}
.led-main small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-amt{font-weight:700;white-space:nowrap}

/* buttons */
button{
  font:inherit;font-weight:600;font-size:15px;width:100%;
  background:var(--dark);color:#fff;border:none;border-radius:10px;
  padding:14px;cursor:pointer;
}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px;font-size:14px;margin-top:10px}
button:active{opacity:.85}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.empty{color:var(--muted);font-size:15px;margin:4px 0 0}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:26px}
@media(min-width:560px){ .hero-figure{font-size:62px} .wrap{padding-top:32px} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="top">
    <div>
      <h1 class="title">The Slate</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
    <a class="btn-link" href="rules.html">Rules</a>
  </div>
</header>

<main id="app"></main>

<footer>Pulled straight from FPL. Nobody types anything in.</footer>
</div>

<script>
const fmt = n => '£' + Number(n).toLocaleString('en-GB');
const pts = n => Number(n).toLocaleString('en-GB');

function card(title, note, inner){
  return `<section class="card">
    <div class="card-head"><h2>${title}</h2>${note ? `<p>${note}</p>` : ''}</div>
    ${inner}
  </section>`;
}

function render(d){
  document.getElementById('sub').textContent =
    `${d.leagueName || 'Private league'} · ${d.currentGameweek ? 'GW' + d.currentGameweek : 'Pre-season'} · updated ` +
    new Date(d.generatedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  const out = [];

  /* hero */
  out.push(`<div class="hero">
    <p class="hero-label">In the transfer pot</p>
    <p class="hero-figure num">${fmt(d.transferPot.balance)}</p>
    <div class="hero-foot">
      <span>Next payout <b>${d.transferPot.nextPeriod ?? 'Season over'}</b></span>
      <span>Overall League winner takes <b class="num">${fmt(d.mainPot)}</b></span>
    </div>
  </div>`);

  /* league table */
  const last = d.standings.length - 1;
  out.push(card('League table', `Winner takes ${fmt(d.mainPot)}`,
    d.standings.map((m,i) => `<div class="row">
      <div class="rank num">${i+1}</div>
      <div class="who"><b>${m.name}${i===last && d.currentGameweek ? '<span class="pill pill-mascot">Mascot</span>' : ''}</b><small>${m.teamName}</small></div>
      <div class="val num">${pts(m.totalPoints)}</div>
    </div>`).join('')));

  /* current period */
  const live = d.periods.find(p => !p.complete && p.table.some(r => r.points > 0));
  if (live){
    out.push(card(live.label, `GW${live.gameweeks[0]}–${live.gameweeks.at(-1)}`,
      live.table.map((r,i) => `<div class="row">
        <div class="rank num">${i+1}</div>
        <div class="who"><b>${r.name}${i===0 ? '<span class="pill pill-lead">Leading</span>' : ''}</b></div>
        <div class="val num">${pts(r.points)}</div>
      </div>`).join('')));
  }

  /* settled periods */
  const done = d.periods.filter(p => p.complete && p.winner);
  if (done.length){
    out.push(card('Pots won', null,
      done.map(p => `<div class="row">
        <div class="who"><b>${p.winner.name}</b><small>${p.label}</small></div>
        <div class="val num">${pts(p.winner.points)}</div>
      </div>`).join('')));
  }

  /* transfers */
  const spend = [...d.contributions].sort((a,b) => b.transfers - a.transfers);
  const max = Math.max(...spend.map(m => m.transfers), 1);
  out.push(card('Transfers', '£1 each',
    spend.some(m => m.transfers)
      ? spend.map(m => `<div class="row">
          <div class="who">
            <b>${m.name}</b>
            <div class="bar"><i style="width:${Math.max((m.transfers/max)*100, m.transfers?4:0)}%"></i></div>
          </div>
          <div class="val money num">${fmt(m.transferFees)}<small>${m.transfers} made</small></div>
        </div>`).join('')
      : '<p class="empty">Nothing yet. Transfers appear within two hours — wildcard and free hit moves don\'t count.</p>'));

  /* fines */
  const fined = d.contributions.filter(m => m.captainFines || m.haalandFines)
    .sort((a,b) => (b.captainFines+b.haalandFines) - (a.captainFines+a.haalandFines));
  out.push(card('Fines', 'Captain £4 · Triple £10 · Haaland £10',
    fined.length
      ? fined.map(m => `<div class="row">
          <div class="who"><b>${m.name}${m.haalandFines ? '<span class="pill pill-ban">Haaland</span>' : ''}</b>
            <small>${[m.captainFines ? `Captain ${fmt(m.captainFines)}` : null, m.haalandFines ? `Haaland ${fmt(m.haalandFines)}` : null].filter(Boolean).join(' · ')}</small></div>
          <div class="val money num">${fmt(m.captainFines + m.haalandFines)}</div>
        </div>`).join('')
      : '<p class="empty">No fines yet. Every captain has cleared four points and nobody has touched Haaland.</p>'));

  /* ledger */
  const L = [...d.ledger].reverse();
  out.push(card('Every penny', `${L.length} entries`,
    L.length
      ? `<div id="led">${L.slice(0,8).map(ledRow).join('')}</div>
         ${L.length > 8 ? '<button class="ghost" id="more">Show all ' + L.length + '</button>' : ''}`
      : '<p class="empty">Fills itself as the season runs.</p>'));

  document.getElementById('app').innerHTML = out.join('');

  const more = document.getElementById('more');
  if (more) more.onclick = () => { document.getElementById('led').innerHTML = L.map(ledRow).join(''); more.remove(); };
}

function ledRow(l){
  return `<div class="led">
    <div class="led-main"><b>${l.manager}</b><small>${l.description}${l.gw ? ' · GW' + l.gw : ''}</small></div>
    <div class="led-amt num ${l.amount < 0 ? 'credit' : 'money'}">${l.amount < 0 ? '−' : ''}${fmt(Math.abs(l.amount))}</div>
  </div>`;
}

fetch('data.json?' + Date.now())
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('sub').textContent = 'No data yet';
    document.getElementById('app').innerHTML =
      '<section class="card"><p class="empty">Run the <b>Update FPL data</b> workflow in GitHub Actions to fill this in.</p></section>';
  });
</script>
</body>
</html>
