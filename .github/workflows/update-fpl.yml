name: Update FPL data

on:
  schedule:
    # Every 2 hours. Tighten to '*/30 * * * *' on deadline day if you want.
    - cron: '0 7,19 * * 1-3'
    - cron: '0 7,11,15,18,21 * * 4,5'
    - cron: '0 9,13,17,20,22 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild league data
        run: node scripts/build-data.js

      - name: Commit if changed
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update FPL data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
